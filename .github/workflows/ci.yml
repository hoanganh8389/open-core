# [2026-11-27 11:20 PM Johnny Chu - Chu Hoàng Anh] C1 — CI: kiểm khung (một số phiên bản, ranh giới nghiệp vụ) + test các gói + bộ kiểm chuẩn của open-platform.
# [2026-11-27 11:31 PM Johnny Chu - Chu Hoàng Anh] C2 — thêm Postgres 16 cho test của @bizcity/platform; users-check đọc từ open-platform (BIZCITY_PLATFORM_DIR).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: x }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:x@localhost:5432/postgres
      BIZCITY_PLATFORM_DIR: ${{ github.workspace }}/_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: hoanganh8389/bizcity-platform, path: _platform }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node _platform/tools/standard-check.mjs --repo .
